<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap">
  <style>
    body { margin: 0; font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif; }
    a { color: #ef7a56; } a:hover { color: #d9633f; }
  </style>
</helmet>
<div style="position: relative; width: 300px; height: 250px; overflow: hidden; background: #12141c; color: #f5f2ec; box-sizing: border-box;">
  <div style="position: absolute; right: -70px; top: -80px; width: 220px; height: 220px; border-radius: 50%; background: #ef7a56;"></div>
  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 24px 24px 22px 24px; box-sizing: border-box;">
    <div style="display: flex; flex-direction: column; gap: 12px; align-items: flex-start;">
      <div style="display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; background: #f5f2ec; color: #12141c; font-size: 11px; font-weight: 700; letter-spacing: 0.06em;">[キャンペーン名]</div>
      <div style="font-size: 38px; line-height: 1.1; font-weight: 900;">[サービス名]<br>新登場</div>
      <div style="font-size: 13px; line-height: 1.4; color: #cfcac0;">[日付]まで、[特典内容]</div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <div style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 8px; background: #ef7a56; color: #12141c; font-size: 13px; font-weight: 700; white-space: nowrap;">
        <span>詳しくはこちら</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#12141c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
      </div>
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #8f8a80;">[ブランド名]</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
